[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "course-deadline-csv-export"
version = "0.1.0"
description = "FastAPI service that exports due learner deadlines to CSV and returns a signed download URL."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "requests>=2.32,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
